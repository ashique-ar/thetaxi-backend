<!DOCTYPE html>
<html>
<head>
    <title>Service Configuration Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Service Configuration Test</h1>
    <div id="result"></div>

    <script>
        $(document).ready(function() {
            $.ajax({
                url: '/api/services/configuration',
                method: 'GET',
                dataType: 'json',
                success: function(response) {
                    console.log('Service Configuration Response:', response);
                    $('#result').html('<pre>' + JSON.stringify(response, null, 2) + '</pre>');
                    
                    // Check for custom_tour service
                    if (response.data && response.data.service_types) {
                        for (let category in response.data.service_types) {
                            const services = response.data.service_types[category].services;
                            const customTour = services.find(s => s.code === 'custom_tour');
                            if (customTour) {
                                $('#result').prepend('<div style="color: green;"><strong>✓ Custom Tour service found in category: ' + category + '</strong></div>');
                                break;
                            }
                        }
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error:', xhr, status, error);
                    $('#result').html('<div style="color: red;">Error: ' + error + '</div>');
                }
            });
        });
    </script>
</body>
</html>
